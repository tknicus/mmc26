<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Offline-First App</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 400px; margin: auto; background-color: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .status { padding: 10px; margin-bottom: 15px; font-weight: bold; text-align: center; border-radius: 5px; transition: 0.3s; }
        .online { background-color: #d4edda; color: #155724; }
        .offline { background-color: #f8d7da; color: #721c24; }
        
        /* BAG-O: Design para sa imong Live Location Box */
        .live-location { 
            background-color: #e2e3e5; 
            color: #383d41; 
            padding: 10px; 
            margin-bottom: 15px; 
            border-radius: 5px; 
            font-size: 14px; 
            text-align: center; 
            border: 1px dashed #adb5bd;
        }

        input, textarea, button { width: 100%; margin-bottom: 12px; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <div class="card">
        <h1 style="text-align: center;">MasterMinds'CUP</h1>
        
        <!-- Internet Status -->
        <div id="statusIndicator" class="status online">🌐 Online - Connected</div>

        <!-- BAG-O: Ang displayhan sa Latitude ug Longitude inig open -->
        <div id="liveLocation" class="live-location">📍 Nangita sa imong location...</div>

        <form id="myForm">
            <input type="text" id="name" placeholder="Imong Pangalan" required>
            <input type="number" id="odometer" placeholder="Odometer (ODO)" required>
            <textarea id="notes" placeholder="Mensahe o Notes o REMARKS" rows="4" required></textarea>
            <button type="submit">I-Submit ang Data</button>
        </form>
    </div>




    <script>
        // Imong Google Apps Script Web App URL
        const scriptURL = 'https://script.google.com/macros/s/AKfycbx25MwnDvb3scoBPhWc7AQn_rjQ9nR2SJlytZG9Ca3SmO6V8N7142Ml660gZFg0OeIa/exec';
        
        const statusIndicator = document.getElementById('statusIndicator');
        const liveLocationDiv = document.getElementById('liveLocation');
        const myForm = document.getElementById('myForm');

        function updateStatus() {
            if (navigator.onLine) {
                statusIndicator.textContent = "🌐 Online - Connected";
                statusIndicator.className = "status online";
                syncOfflineData(); 
            } else {
                statusIndicator.textContent = "⚠️ Offline - Walay Internet";
                statusIndicator.className = "status offline";
            }
        }

        window.addEventListener('online', updateStatus);
        window.addEventListener('offline', updateStatus);

        // BAG-O: Function para ipakita dayon ang Lat/Long sa screen pag-abli
        function showLiveLocationOnLoad() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude.toFixed(6); // toFixed(6) para dili taas kaayo ang numbers
                        const lon = position.coords.longitude.toFixed(6);
                        liveLocationDiv.innerHTML = `📍 <b>Lat:</b> ${lat} &nbsp;|&nbsp; <b>Lon:</b> ${lon}`;
                    },
                    (error) => {
                        liveLocationDiv.innerHTML = "⚠️ Palihug i-allow ang Location / GPS sa imong device.";
                    },
                    { enableHighAccuracy: true }
                );
            } else {
                liveLocationDiv.innerHTML = "❌ GPS wala gisuportahan sa imong device.";
            }
        }

        async function sendDataToServer(dataPayload) {
            try {
                await fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
                    body: JSON.stringify(dataPayload)
                });
                return true; 
            } catch (error) {
                console.error("Error sending data:", error);
                return false;
            }
        }

        async function syncOfflineData() {
            let savedData = JSON.parse(localStorage.getItem('offlineData')) || [];
            if (savedData.length > 0 && navigator.onLine) {
                statusIndicator.textContent = "🔄 Nag-sync sa imong data, kadiyot lang...";
                statusIndicator.style.backgroundColor = "#ffc107"; 
                
                let success = await sendDataToServer(savedData); 
                if (success) {
                    localStorage.removeItem('offlineData'); 
                    alert("✅ Na-send na sa Google Sheets ang mga data nga gi-save pag offline!");
                    updateStatus(); 
                }
            }
        }

        // Ang mu-kuha sa final GPS para isulod sa Google Sheet
        function getLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve({ link: "No GPS", lat: "N/A", lon: "N/A", time: "N/A" });
                } else {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            const lat = position.coords.latitude;
                            const lon = position.coords.longitude;
                            const locTime = new Date(position.timestamp).toLocaleString(); 
                            
                            resolve({
                                link: `https://www.google.com/maps?q=${lat},${lon}`,
                                lat: lat,
                                lon: lon,
                                time: locTime
                            });
                        },
                        (error) => {
                            resolve({ link: "Error/Gibalibaran", lat: "N/A", lon: "N/A", time: "N/A" });
                        },
                        { timeout: 10000, enableHighAccuracy: true }
                    );
                }
            });
        }

        myForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitBtn = myForm.querySelector('button');
            submitBtn.textContent = "📍 Gikuha ang Location ug Gipadala...";
            submitBtn.disabled = true;

            const gpsData = await getLocation();

            const data = {
                name: document.getElementById('name').value,
                odometer: document.getElementById('odometer').value, // Gibag-o nato og ODO
                notes: document.getElementById('notes').value,
                timestamp: new Date().toLocaleString(), 
                location: gpsData.link,
                latitude: gpsData.lat,
                longitude: gpsData.lon,
                locationTime: gpsData.time 
            };

            if (navigator.onLine) {
                let success = await sendDataToServer(data);
                if (success) {
                    alert("✅ Success! Check imong Google Sheet, nisulod na!");
                } else {
                    alert("❌ Naay error sa pag-send. I-try usab.");
                }
            } else {
                let savedData = JSON.parse(localStorage.getItem('offlineData')) || [];
                savedData.push(data);
                localStorage.setItem('offlineData', JSON.stringify(savedData));
                alert("⚠️ Walay Internet! Gi-save ang imong Location ug Data sa device.");
            }

            myForm.reset();
            submitBtn.textContent = "I-Submit ang Data";
            submitBtn.disabled = false;
        });

        // E-run dayon ni inig abli sa app
        updateStatus();
        showLiveLocationOnLoad(); // <-- Kini ang mopagawas sa GPS display sa ibabaw
    </script>



</body>
</html>
