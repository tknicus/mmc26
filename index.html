<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Offline-First App</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 400px; margin: auto; background-color: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .status { padding: 10px; margin-bottom: 20px; font-weight: bold; text-align: center; border-radius: 5px; transition: 0.3s; }
        .online { background-color: #d4edda; color: #155724; }
        .offline { background-color: #f8d7da; color: #721c24; }
        input, textarea, button { width: 100%; margin-bottom: 12px; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <div class="card">
        <h2>E-Submit Imong Data</h2>
        
        <!-- Dinhi makita ang internet status -->
        <div id="statusIndicator" class="status online">🌐 Online - Connected</div>

        <form id="myForm">
            <input type="text" id="name" placeholder="Imong Pangalan" required>
            <input type="email" id="email" placeholder="Imong Email" required>
            <textarea id="notes" placeholder="Mensahe o Notes" rows="4" required></textarea>
            <button type="submit">I-Submit ang Data</button>
        </form>
    </div>


    <script>
        // Imong Google Apps Script Web App URL
        const scriptURL = 'https://script.google.com/macros/s/AKfycbx25MwnDvb3scoBPhWc7AQn_rjQ9nR2SJlytZG9Ca3SmO6V8N7142Ml660gZFg0OeIa/exec';
        
        const statusIndicator = document.getElementById('statusIndicator');
        const myForm = document.getElementById('myForm');

        function updateStatus() {
            if (navigator.onLine) {
                statusIndicator.textContent = "🌐 Online - Connected";
                statusIndicator.className = "status online";
                syncOfflineData(); 
            } else {
                statusIndicator.textContent = "⚠️ Offline - Walay Internet";
                statusIndicator.className = "status offline";
            }
        }

        window.addEventListener('online', updateStatus);
        window.addEventListener('offline', updateStatus);

        async function sendDataToServer(dataPayload) {
            try {
                await fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
                    body: JSON.stringify(dataPayload)
                });
                return true; 
            } catch (error) {
                console.error("Error sending data:", error);
                return false;
            }
        }

        async function syncOfflineData() {
            let savedData = JSON.parse(localStorage.getItem('offlineData')) || [];
            if (savedData.length > 0 && navigator.onLine) {
                statusIndicator.textContent = "🔄 Nag-sync sa imong data, kadiyot lang...";
                statusIndicator.style.backgroundColor = "#ffc107"; 
                
                let success = await sendDataToServer(savedData); 
                if (success) {
                    localStorage.removeItem('offlineData'); 
                    alert("✅ Na-send na sa Google Sheets ang mga data nga gi-save pag offline!");
                    updateStatus(); 
                }
            }
        }

        // BAG-O NGA LOCATION FUNCTION: Mukuha na og Lat, Long, ug GPS Time
        function getLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve({ link: "No GPS", lat: "N/A", lon: "N/A", time: "N/A" });
                } else {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            const lat = position.coords.latitude;
                            const lon = position.coords.longitude;
                            // position.timestamp mao ang exact time nga ni-lock ang satellite
                            const locTime = new Date(position.timestamp).toLocaleString(); 
                            
                            resolve({
                                link: `https://www.google.com/maps?q=${lat},${lon}`,
                                lat: lat,
                                lon: lon,
                                time: locTime
                            });
                        },
                        (error) => {
                            resolve({ link: "Error/Gibalibaran", lat: "N/A", lon: "N/A", time: "N/A" });
                        },
                        { timeout: 10000, enableHighAccuracy: true } // Gihimo nakong High Accuracy para mas pino
                    );
                }
            });
        }

        myForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitBtn = myForm.querySelector('button');
            submitBtn.textContent = "📍 Gikuha ang Location ug Gipadala...";
            submitBtn.disabled = true;

            // Kuhaon una ang kumpleto nga GPS Data
            const gpsData = await getLocation();

            const data = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                notes: document.getElementById('notes').value,
                timestamp: new Date().toLocaleString(), // Oras pag-pindot sa Submit Button
                location: gpsData.link,
                latitude: gpsData.lat,
                longitude: gpsData.lon,
                locationTime: gpsData.time // Oras sa satellite/GPS
            };

            if (navigator.onLine) {
                let success = await sendDataToServer(data);
                if (success) {
                    alert("✅ Success! Check imong Google Sheet, nisulod na!");
                } else {
                    alert("❌ Naay error sa pag-send. I-try usab.");
                }
            } else {
                let savedData = JSON.parse(localStorage.getItem('offlineData')) || [];
                savedData.push(data);
                localStorage.setItem('offlineData', JSON.stringify(savedData));
                alert("⚠️ Walay Internet! Gi-save ang imong Location ug Data sa device.");
            }

            myForm.reset();
            submitBtn.textContent = "I-Submit ang Data";
            submitBtn.disabled = false;
        });

        updateStatus();
    </script>

    
</body>
</html>
