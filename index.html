<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="./manifest.json">

    <!-- 🎨 SUGOD SA MODERN DARK RACING THEME 🎨 -->
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212; /* Dark background */
            color: #f5f5f5; /* Puti nga text */

            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: #1e1e1e; /* Medyo light nga dark */
            width: 100%;
            max-width: 450px;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 8px 15px rgba(0, 0, 0, 0.8);
            border-top: 5px solid #cc0000; /* Pula nga linya sa ibabaw */
            box-sizing: border-box;
        }

        /* Logo Styling */
        .app-logo {
            width: 100%;
            max-width: 250px;
            display: block;
            margin: 0 auto 15px auto; /* I-center ang logo */
        }

        h4 {
            text-align: center;
            color: #ffffff;
            margin-top: 0;
            text-transform: lowercase;
            font-style: italic; /* Pang-racing nga porma */
            letter-spacing: 1px;
            font-size: 15px;
        }

        h2 {
            text-align: center;
            color: #ffffff;
            margin-top: 0;
            text-transform: uppercase;
            font-style: italic; /* Pang-racing nga porma */
            letter-spacing: 1px;
            font-size: 20px;
        }

        /* Status & Location Indicators */
        #statusIndicator, #liveLocation {
            text-align: center;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 14px;
        }
        
        #liveLocation {
            background-color: #2a2a2a;
            border: 1px solid #444;
            color: #ccc;
        }

        .status.online { background-color: #1b5e20; color: white; }
        .status.offline { background-color: #cc0000; color: white; }

        /* Input Boxes */
        input[type="text"], 
        input[type="number"],
        textarea {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #444;
            border-radius: 4px;
            background-color: #2a2a2a; /* Dark nga kahon */
            color: #ffffff;
            font-size: 16px;
            box-sizing: border-box;
            transition: all 0.3s ease;
            font-family: Arial, sans-serif;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #cc0000; /* Mo-pula ang kilid kung i-click */
            box-shadow: 0 0 5px rgba(204, 0, 0, 0.5);
        }

        input[readonly] {
            background-color: #1a1a1a;
            color: #888;
        }

        /* Buttons (Dagko para dali ma-click) */
        button {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.2s;
        }

        /* Ang Main Submit Button (Pula) */
        button[type="submit"] {
            background-color: #cc0000; /* MasterMinds Red */
            color: white;
            box-shadow: 0 4px 6px rgba(204, 0, 0, 0.3);
            margin-top: 5px;
        }

        button[type="submit"]:hover {
            background-color: #990000;
        }
        
        button[type="submit"]:disabled {
            background-color: #555;
            color: #888;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Ang Camera Button (Grey/Silver) */
        .camera-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
            margin-bottom: 15px;
        }
        
        .camera-btn {
            background-color: #444;
            color: white;
        }

        .camera-btn:hover { background-color: #555; }

        .camera-btn-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            height: 100%;
            width: 100%; /* <-- IDUGANG KINI ARO MASAKOP ANG TIBUOK BUTTON */
        }

        /* Picture Preview */
        #photoPreview {
            max-width: 100%;
            border: 2px dashed #cc0000; /* Pula nga border kung naay pic */
            border-radius: 5px;
            margin-bottom: 15px;
            display: none; /* Tago una kung walay pic */
        }


        /* DESIGN PARA SA DROPDOWN ARON MASIGO UG MO-ITOM */
        select {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #444;
            border-radius: 4px;
            background-color: #2a2a2a; /* Kini ang mopaitom niya */
            color: #ffffff; /* Puti nga text */
            font-size: 16px;
            box-sizing: border-box; /* KINI GYUD ANG MOPUGOS NGA DILI SIYA MOLAPAS */
            transition: all 0.3s ease;
            font-family: Arial, sans-serif;
        }

        select:focus {
            outline: none;
            border-color: #cc0000;
            box-shadow: 0 0 5px rgba(204, 0, 0, 0.5);
        }
    </style>
    <!-- 🎨 KATAPUSAN SA THEME 🎨 -->
</head>

    <!-- IMONG ORIGINAL NGA JAVASCRIPT (WALA GITHUBTAN) -->
    <script src="database.js"></script>
    <script>
        let compressedPhotoBase64 = ""; 

        document.getElementById('cameraInput').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.getElementById('photoCanvas');
                        const ctx = canvas.getContext("2d");

                        const MAX_WIDTH = 600;
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scaleSize;

                        // 1. Drawing sa picture
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                        // 2. Drawing sa Logo (Left Bottom)
                        const logoImg = new Image();
                        logoImg.src = 'mmc.png';
                        logoImg.onload = function() {
                            // const logoWidth = canvas.width * 0.15; // 15% sa width
                            const logoWidth = canvas.width * 0.25; // I-set kini sa 0.25 (25%)
                            const logoHeight = (logoImg.height / logoImg.width) * logoWidth;
                            
                            // Drawing sa Logo (Left Bottom)
                            // x = 10 (margin sa left)
                            // y = canvas.height - logoHeight - 10 (margin sa ubos)
                            ctx.drawImage(logoImg, 10, canvas.height - logoHeight - 10, logoWidth, logoHeight);

                        // 3. ✨ Drawing sa Text (ID+Name, Date+Time, ug GPS sa Right Bottom) ✨
                        ctx.fillStyle = "white";
                        ctx.strokeStyle = "black"; 
                        ctx.lineWidth = 3;
                        ctx.font = "bold 16px Arial"; // ⬅️ Gi-gamyan nato sa 16px aron masigo ang taas nga detalye
                        ctx.textAlign = "right";

                        // Kuhaon ang ID ug ang Pangalan (Alias/Nickname)
                        const riderID = document.getElementById('idNum').value || "WALA I-SCAN";
                        const riderName = document.getElementById('name').value || "Wala Kaila";
                        
                        // Kuhaon ang Date UG Time dungan (toLocaleString)
                        const dateTimeNow = new Date().toLocaleString(); 
                        
                        // A. I-stamp ang Rider ID ug Pangalan (Pinakataas)
                        // Porma: ID: 0001 (technicus)
                        const textA = `ID: ${riderID} (${riderName})`;
                        ctx.strokeText(textA, canvas.width - 10, canvas.height - 55);
                        ctx.fillText(textA, canvas.width - 10, canvas.height - 55);

                        // B. I-stamp ang Date ug Time (Tunga)
                        // Porma: Date/Time: 8/21/2026, 10:44:22 PM
                        const textB = `Date/Time: ${dateTimeNow}`;
                        ctx.strokeText(textB, canvas.width - 10, canvas.height - 35);
                        ctx.fillText(textB, canvas.width - 10, canvas.height - 35);

                        // C. I-stamp ang GPS Coordinates (Pinaka-ubos)
                        const textC = `Lat: ${globalLat} | Lon: ${globalLon}`;
                        ctx.strokeText(textC, canvas.width - 10, canvas.height - 15);
                        ctx.fillText(textC, canvas.width - 10, canvas.height - 15);
                        
                        // 4. E-convert sa Text (Base64)
                        compressedPhotoBase64 = canvas.toDataURL("image/jpeg", 0.5);
                        const photoPreview = document.getElementById('photoPreview');
                        photoPreview.src = compressedPhotoBase64;
                        photoPreview.style.display = "block";
                        };
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        });
        
        window.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const scannedID = urlParams.get('theIDno'); 

            if (scannedID) {
                document.getElementById('idNum').value = scannedID;

                if (typeof riderDatabase !== 'undefined') {
                    const rider = riderDatabase.find(r => String(r.idNum) === String(scannedID));
                    const nameBox = document.getElementById('name');

                    if (rider) {
                        nameBox.value = rider.fullname;
                        nameBox.readOnly = true; 
                    } else {
                        nameBox.value = "❌ Wala sa Masterlist!";
                        nameBox.style.color = "red";
                        nameBox.readOnly = true;
                    }
                }
            }
        });

        const scriptURL = 'https://script.google.com/macros/s/AKfycby_4MwwGkRxmWI2zND7fiQN3N9wTmkm3TCg6f5xteV0bEwAj89xOCte6gRYqUE6AsB6/exec';
        
        const statusIndicator = document.getElementById('statusIndicator');
        const liveLocationDiv = document.getElementById('liveLocation');
        const myForm = document.getElementById('myForm');

        function updateStatus() {
            if (navigator.onLine) {
                statusIndicator.textContent = "🌐 Online - Connected";
                statusIndicator.className = "status online";
                syncOfflineData(); 
            } else {
                statusIndicator.textContent = "⚠️ Offline - Walay Internet";
                statusIndicator.className = "status offline";
            }
        }

        window.addEventListener('online', updateStatus);
        window.addEventListener('offline', updateStatus);



        // 1. Maghimo ta og global memory para sa GPS aron andam na daan
        let globalLat = "N/A";
        let globalLon = "N/A";

        // 2. Ang bag-ong Live Tracker (watchPosition)
        function showLiveLocationOnLoad() {
            if (navigator.geolocation) {
                // Imbes nga getCurrentPosition, atong gigamit ang watchPosition aron mo-update permi!
                navigator.geolocation.watchPosition(
                    (position) => {
                        globalLat = position.coords.latitude.toFixed(6);
                        globalLon = position.coords.longitude.toFixed(6);
                        liveLocationDiv.innerHTML = `📍 <b>Lat:</b> ${globalLat} &nbsp;|&nbsp; <b>Lon:</b> ${globalLon}`;
                    },
                    (error) => {
                        liveLocationDiv.innerHTML = "⚠️ Palihug i-allow ang Location / GPS.";
                    },
                    { enableHighAccuracy: true, maximumAge: 0 } // maximumAge: 0 aron presko pirme ang GPS
                );
            } else {
                liveLocationDiv.innerHTML = "❌ GPS wala gisuportahan sa imong device.";
            }
        }




        // --- 🛡️ BAG-ONG SEND FUNCTION NAAY TIMER PARA SA LIE-FI 🛡️ ---
        async function sendDataToServer(dataPayload) {
            try {
                // Maghimo ta og timer nga 8 segundos (8000 milliseconds)
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 8000);

                await fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
                    body: JSON.stringify(dataPayload),
                    signal: controller.signal // Dire natong gi-apil ang timer
                });

                clearTimeout(timeoutId); // Limpyohan ang timer kay nakuha ra sa oras
                return true; 
            } catch (error) {
                // Kung naay error O nag-timeout kay hinay ang net (Lie-Fi)
                console.error("Error o Hinay kaayo ang net:", error);
                return false;
            }
        }

        async function syncOfflineData() {
            let savedData = JSON.parse(localStorage.getItem('offlineData')) || [];
            if (savedData.length > 0 && navigator.onLine) {
                statusIndicator.textContent = "🔄 Nag-sync sa imong data, kadiyot lang...";
                statusIndicator.style.backgroundColor = "#ffc107"; 
                
                let success = await sendDataToServer(savedData); 
                if (success) {
                    localStorage.removeItem('offlineData'); 
                    alert("✅ Na-send na sa Google Sheets ang mga data nga gi-save pag offline!");
                    updateStatus(); 
                }
            }
        }

        function getLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve({ link: "No GPS", lat: "N/A", lon: "N/A", time: "N/A" });
                } else {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            const lat = position.coords.latitude;
                            const lon = position.coords.longitude;
                            const locTime = new Date(position.timestamp).toLocaleString(); 
                            
                            resolve({
                                link: `https://www.google.com/maps?q=${lat},${lon}`,
                                lat: lat,
                                lon: lon,
                                time: locTime
                            });
                        },
                        (error) => {
                            resolve({ link: "Error/Gibalibaran", lat: "N/A", lon: "N/A", time: "N/A" });
                        },
                        { timeout: 10000, enableHighAccuracy: true, maximumAge: 0 }
                    );
                }
            });
        }

        myForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            // BAG-O: Gitumbok gyud nato ang button nga naay type="submit"
            const submitBtn = myForm.querySelector('button[type="submit"]');

            submitBtn.textContent = "📍 Gipadala ang Data...";
            submitBtn.disabled = true;

            // 🎵 1. E-PLAY ANG MUSIC DAYON PAG-PISLIT! 🎵
            const bgMusic = document.getElementById('submitMusic');
            bgMusic.play();

            // --- 🛑 BANTAY SA RIDER ID UG PANGALAN 🛑 ---
            const checkId = document.getElementById('idNum').value;
            const checkName = document.getElementById('name').value;

            if (checkId === "" || checkName === "" || checkName.includes("❌")) {
                bgMusic.pause(); // Ihunong ang kanta
                bgMusic.currentTime = 0; // I-rewind
                
                alert("🛑 DILI MA-SAVE! Blangko ang Rider ID. Palihug i-scan ang saktong QR Code sa Rider una ka mo-submit.");
                
                submitBtn.textContent = "I-Submit ang Data";
                submitBtn.disabled = false;
                return; // KINI ANG MOPAHUNONG ARON DILI MOLAHOS OG SAVE!
            }
            // --- 🛑 KATAPUSAN SA BANTAY SA ID 🛑 ---

            // Mokuha sa GPS data gikan sa imong function
            const gpsData = await getLocation();

            // --- 🛑 BANTAY SA LOCATION (KUNG MAG-ERROR) ---
            if (gpsData.lat === "N/A" || gpsData.link === "No GPS" || gpsData.link === "Error/Gibalibaran") {
                bgMusic.pause(); // 🛑 Ihunong ang kanta
                bgMusic.currentTime = 0; // I-rewind sa sugod

                alert("🛑 DILI MA-SAVE! Palihug i-allow o i-on ang Location / GPS sa imong selpon usa ka mo-submit.");
                submitBtn.textContent = "I-Submit ang Data";
                submitBtn.disabled = false;
                return; 
            }

            // --- 🛑 BANTAY SA PICTURE 🛑 ---
            if (compressedPhotoBase64 === "") {
                bgMusic.pause(); // 🛑 Ihunong ang kanta
                bgMusic.currentTime = 0; // I-rewind

                alert("📸 DILI MA-SAVE! Palihug pagkuha og Ebidensya/Picture una ka mo-submit.");
                submitBtn.textContent = "I-Submit ang Data";
                submitBtn.disabled = false;
                return; // Mopahunong sa code
            }

            const data = {
                idNum: document.getElementById('idNum').value,
                name: document.getElementById('name').value,
                checkpoint: document.getElementById('checkpoint').value, // <-- IDUGANG KINI
                odometer: document.getElementById('odometer').value, 
                notes: document.getElementById('notes').value,
                photo: compressedPhotoBase64, 
                timestamp: new Date().toLocaleString(), 
                location: gpsData.link,
                latitude: gpsData.lat,
                longitude: gpsData.lon,
                locationTime: gpsData.time 
            };

            // MAGHIMO TA OG VARIABLE NGA MAGBANTAY KUNG LUWAS NA BA ANG DATA
            let isDataSaved = false;

            if (navigator.onLine) {
                let success = await sendDataToServer(data);
                if (success) {
                    bgMusic.pause(); bgMusic.currentTime = 0; // 🛑 IHUNONG ANG KANTA KAY SUCCESS NA!
                    alert("✅ Success! Check imong Google Sheet, nisulod na!");
                    isDataSaved = true; // Luwas na didto sa server!
                } else {
                    bgMusic.pause(); bgMusic.currentTime = 0; // 🛑 IHUNONG ANG KANTA
                    // KUNG MAPUTOL ANG INTERNET PAG-SEND! (Ang imong gipangutana)
                    alert("⚠️ Na-putol ang signal pag-send! I-save nato sa Offline Data sa imong selpon aron dili masayang.");
                    
                    // I-PUGOS OG SAVE SA LOCAL STORAGE BISAN PA OG "ONLINE" SIYA
                    let savedData = JSON.parse(localStorage.getItem('offlineData')) || [];
                    savedData.push(data);
                    localStorage.setItem('offlineData', JSON.stringify(savedData));
                    isDataSaved = true; // Luwas na kay na-save sa selpon!
                    updateStatus(); // I-trigger ang offline indicator kung guba ang signal
                }
            } else {
                bgMusic.pause(); bgMusic.currentTime = 0; // 🛑 IHUNONG ANG KANTA
                // NORMAL OFFLINE SAVING
                let savedData = JSON.parse(localStorage.getItem('offlineData')) || [];
                savedData.push(data);
                localStorage.setItem('offlineData', JSON.stringify(savedData));
                alert("⚠️ Walay Internet! Gi-save ang imong Location ug Data sa device.");
                isDataSaved = true; // Luwas na kay na-save sa selpon!
            }

            // I-RESET LANG ANG FORM KUNG SIGURADO NGA "SAVED" ANG DATA
            if (isDataSaved) {
                myForm.reset();
                compressedPhotoBase64 = ""; 
                document.getElementById('photoPreview').style.display = "none"; 
            }
            
            // I-balik ang button sa normal pirme
            submitBtn.textContent = "I-Submit ang Data";
            submitBtn.disabled = false;
        });

        updateStatus();
        showLiveLocationOnLoad(); 

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('./sw.js')
