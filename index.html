    <script>
        let compressedPhotoBase64 = ""; 

        document.getElementById('cameraInput').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.getElementById('photoCanvas');
                        const ctx = canvas.getContext("2d");

                        const MAX_WIDTH = 600;
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scaleSize;

                        // 1. Drawing sa picture
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                        // 2. Drawing sa Logo (Left Bottom)
                        const logoImg = new Image();
                        logoImg.src = 'mmc.png';
                        logoImg.onload = function() {
                            // const logoWidth = canvas.width * 0.15; // 15% sa width
                            const logoWidth = canvas.width * 0.28; // I-set kini sa 0.25 (25%)
                            const logoHeight = (logoImg.height / logoImg.width) * logoWidth;
                            
                            // Drawing sa Logo (Left Bottom)
                            // x = 10 (margin sa left)
                            // y = canvas.height - logoHeight - 10 (margin sa ubos)
                            ctx.drawImage(logoImg, 10, canvas.height - logoHeight - 10, logoWidth, logoHeight);



                        // --- 🛠️ HELPER FUNCTION PARA SA DMS (Degrees, Minutes, Seconds) 🛠️ ---
                        function convertToDMS(decimal, isLat) {
                            if (decimal === "N/A") return "N/A";
                            const val = parseFloat(decimal);
                            const absVal = Math.abs(val);
                            const d = Math.floor(absVal);
                            const m = Math.floor((absVal - d) * 60);
                            const s = ((absVal - d - m / 60) * 3600).toFixed(0); // Walay decimal sa seconds
                            const dir = isLat ? (val >= 0 ? "N" : "S") : (val >= 0 ? "E" : "W");
                            return `${d}° ${m}' ${s}" ${dir}`;
                        }
                        
                        // 3. ✨ Drawing sa Text (ID+Name, Military Time, ug DMS GPS) ✨
                        ctx.fillStyle = "white";
                        ctx.strokeStyle = "black"; 
                        ctx.lineWidth = 3;
                        ctx.font = "bold 16px Arial"; 
                        ctx.textAlign = "right";

                        const riderID = document.getElementById('idNum').value || "WALA I-SCAN";
                        const riderName = document.getElementById('name').value || "Wala Kaila";
                        
                        // --- 🪖 MILITARY TIME FORMAT (YYYY-MM-DD HH:mm:ss) 🪖 ---
                        const now = new Date();
                        const year = now.getFullYear();
                        const month = String(now.getMonth() + 1).padStart(2, '0'); // Butangag '0' sa atubangan kon single digit
                        const day = String(now.getDate()).padStart(2, '0');
                        const hours = String(now.getHours()).padStart(2, '0');
                        const minutes = String(now.getMinutes()).padStart(2, '0');
                        const seconds = String(now.getSeconds()).padStart(2, '0');
                        
                        // Ehemplo: 2026-08-21 23:08:13
                        const militaryDateTime = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;

                        // --- 🌍 DMS GPS FORMAT 🌍 ---
                        const dmsLat = convertToDMS(globalLat, true);
                        const dmsLon = convertToDMS(globalLon, false);

                        // A. I-stamp ang Rider ID ug Pangalan (Pinakataas)
                        const textA = `ID: ${riderID} (${riderName})`;
                        ctx.strokeText(textA, canvas.width - 10, canvas.height - 55);
                        ctx.fillText(textA, canvas.width - 10, canvas.height - 55);

                        // B. I-stamp ang Military Date ug Time (Tunga)
                        const textB = `Date/Time: ${militaryDateTime}`;
                        ctx.strokeText(textB, canvas.width - 10, canvas.height - 35);
                        ctx.fillText(textB, canvas.width - 10, canvas.height - 35);

                        // C. I-stamp ang DMS GPS Coordinates (Pinaka-ubos)
                        const textC = `${dmsLat}, ${dmsLon}`;
                        ctx.strokeText(textC, canvas.width - 10, canvas.height - 15);
                        ctx.fillText(textC, canvas.width - 10, canvas.height - 15);


                        // 4. E-convert sa Text (Base64)
                        compressedPhotoBase64 = canvas.toDataURL("image/jpeg", 0.5);
                        const photoPreview = document.getElementById('photoPreview');
                        photoPreview.src = compressedPhotoBase64;
                        photoPreview.style.display = "block";
                        };
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        });
        


        const scriptURL = 'https://script.google.com/macros/s/AKfycby_4MwwGkRxmWI2zND7fiQN3N9wTmkm3TCg6f5xteV0bEwAj89xOCte6gRYqUE6AsB6/exec';
        
        //const statusIndicator = document.getElementById('statusIndicator');
        const liveLocationDiv = document.getElementById('liveLocation');
        const myForm = document.getElementById('myForm');




        // 1. Maghimo ta og global memory para sa GPS aron andam na daan
        let globalLat = "N/A";
        let globalLon = "N/A";

        // 2. Ang bag-ong Live Tracker (watchPosition)
        function showLiveLocationOnLoad() {
            if (navigator.geolocation) {
                // Imbes nga getCurrentPosition, atong gigamit ang watchPosition aron mo-update permi!
                navigator.geolocation.watchPosition(
                    (position) => {
                        globalLat = position.coords.latitude.toFixed(6);
                        globalLon = position.coords.longitude.toFixed(6);
                        liveLocationDiv.innerHTML = `📍 <b>Lat:</b> ${globalLat} &nbsp;|&nbsp; <b>Lon:</b> ${globalLon}`;
                    },
                    (error) => {
                        liveLocationDiv.innerHTML = "⚠️ Palihug i-allow ang Location / GPS.";
                    },
                    { enableHighAccuracy: true, maximumAge: 0 } // maximumAge: 0 aron presko pirme ang GPS
                );
            } else {
                liveLocationDiv.innerHTML = "❌ GPS wala gisuportahan sa imong device.";
            }
        }




        // --- 🛡️ BAG-ONG SEND FUNCTION NAAY TIMER PARA SA LIE-FI 🛡️ ---
        async function sendDataToServer(dataPayload) {
            try {
                // Maghimo ta og timer nga 8 segundos (8000 milliseconds)
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 8000);

                await fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
                    body: JSON.stringify(dataPayload),
                    signal: controller.signal // Dire natong gi-apil ang timer
                });

                clearTimeout(timeoutId); // Limpyohan ang timer kay nakuha ra sa oras
                return true; 
            } catch (error) {
                // Kung naay error O nag-timeout kay hinay ang net (Lie-Fi)
                console.error("Error o Hinay kaayo ang net:", error);
                return false;
            }
        }



        // --- 🔄 SMART SYNC OFFLINE DATA 🔄 ---
        async function syncOfflineData() {
            let offlineData = JSON.parse(localStorage.getItem('offlineData')) || [];
            
            if (offlineData.length > 0) {
                // I-disable ang submit button samtang nag-sync aron dili maka-samok
                const submitBtn = document.getElementById('myForm').querySelector('button[type="submit"]');
                if(submitBtn) { submitBtn.textContent = "🔄 Nag-Sync sa Data..."; submitBtn.disabled = true; }

                console.log(`Nagsugod og sync sa ${offlineData.length} ka records...`);
                let failedData = []; // Dinhi nato ibutang kung unsa gyud ang WALA nisulod

                // 🌟 LOOP: I-SEND NATO USA-USA (One at a time) 🌟
                for (let i = 0; i < offlineData.length; i++) {
                    let singleRecord = offlineData[i];
                    
                    try {
                        console.log(`Nag-send sa record ${i+1}...`);
                        // E-send ang usa ka record
                        let success = await sendDataToServer(singleRecord); 
                        
                        if (!success) {
                            // Kung mi-fail ni (pananglitan naputol utro ang internet), i-save nato sa failedData
                            console.log(`❌ Failed ang record ${i+1}. I-tago usa.`);
                            failedData.push(singleRecord);
                        } else {
                            console.log(`✅ Success ang record ${i+1}.`);
                            // Kung success, DILI nato i-apil sa failedData (so, technically, ma-delete na siya)
                        }
                    } catch (error) {
                        console.log(`❌ Error sa record ${i+1}:`, error);
                        failedData.push(singleRecord);
                    }
                }

                // 🌟 HUMAN SA LOOP, I-SAVE OG BALIK ANG MGA WALA NAKALUSOT 🌟
                if (failedData.length > 0) {
                    localStorage.setItem('offlineData', JSON.stringify(failedData));
                    console.log(`⚠️ Naay ${failedData.length} ka records nga wala nakalusot. I-try usab unya.`);
                } else {
                    // KUNG NAKALUSOT TANAN, HAWANAN ANG OFFLINE CACHE!
                    localStorage.removeItem('offlineData');
                    console.log("🎉 SUCCESS! Nahawan na ang tanang Offline Data.");
                    alert("✅ Naka-Sync na ang tanang Offline Data padulong sa Database!");
                }

                // I-balik sa normal ang button
                if(submitBtn) { submitBtn.textContent = "I-Submit ang Data"; submitBtn.disabled = false; }
                //updateStatus(); 
            }
        }



        function getLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve({ link: "No GPS", lat: "N/A", lon: "N/A", time: "N/A" });
                } else {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            const lat = position.coords.latitude;
                            const lon = position.coords.longitude;
                            const locTime = new Date(position.timestamp).toLocaleString(); 
                            
                            resolve({
                                link: `https://www.google.com/maps?q=${lat},${lon}`,
                                lat: lat,
                                lon: lon,
                                time: locTime
                            });
                        },
                        (error) => {
                            resolve({ link: "Error/Gibalibaran", lat: "N/A", lon: "N/A", time: "N/A" });
                        },
                        { timeout: 10000, enableHighAccuracy: true, maximumAge: 0 }
                    );
                }
            });
        }

        myForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            // BAG-O: Gitumbok gyud nato ang button nga naay type="submit"
            const submitBtn = myForm.querySelector('button[type="submit"]');

            submitBtn.textContent = "📍 Gipadala ang Data...";
            submitBtn.disabled = true;

            // 🎵 1. E-PLAY ANG MUSIC DAYON PAG-PISLIT! 🎵
            const bgMusic = document.getElementById('submitMusic');
            bgMusic.play();

            // --- 🛑 BANTAY SA RIDER ID UG PANGALAN 🛑 ---
            const checkId = document.getElementById('idNum').value;
            const checkName = document.getElementById('name').value;

            if (checkId === "" || checkName === "" || checkName.includes("❌")) {
                bgMusic.pause(); // Ihunong ang kanta
                bgMusic.currentTime = 0; // I-rewind
                
                alert("🛑 DILI MA-SAVE! Blangko ang Rider ID. Palihug i-scan ang saktong QR Code sa Rider una ka mo-submit.");
                
                submitBtn.textContent = "I-Submit ang Data";
                submitBtn.disabled = false;
                return; // KINI ANG MOPAHUNONG ARON DILI MOLAHOS OG SAVE!
            }
            // --- 🛑 KATAPUSAN SA BANTAY SA ID 🛑 ---

            // Mokuha sa GPS data gikan sa imong function
            const gpsData = await getLocation();

            // --- 🛑 BANTAY SA LOCATION (KUNG MAG-ERROR) ---
            if (gpsData.lat === "N/A" || gpsData.link === "No GPS" || gpsData.link === "Error/Gibalibaran") {
                bgMusic.pause(); // 🛑 Ihunong ang kanta
                bgMusic.currentTime = 0; // I-rewind sa sugod

                alert("🛑 DILI MA-SAVE! Palihug i-allow o i-on ang Location / GPS sa imong selpon usa ka mo-submit.");
                submitBtn.textContent = "I-Submit ang Data";
                submitBtn.disabled = false;
                return; 
            }

            // --- 🛑 BANTAY SA PICTURE 🛑 ---
            if (compressedPhotoBase64 === "") {
                bgMusic.pause(); // 🛑 Ihunong ang kanta
                bgMusic.currentTime = 0; // I-rewind

                alert("📸 DILI MA-SAVE! Palihug pagkuha og Ebidensya/Picture una ka mo-submit.");
                submitBtn.textContent = "I-Submit ang Data";
                submitBtn.disabled = false;
                return; // Mopahunong sa code
            }

            const data = {
                idNum: document.getElementById('idNum').value,
                name: document.getElementById('name').value,
                checkpoint: document.getElementById('checkpoint').value, // <-- IDUGANG KINI
                odometer: document.getElementById('odometer').value, 
                notes: document.getElementById('notes').value,
                photo: compressedPhotoBase64, 
                timestamp: new Date().toLocaleString(), 
                location: gpsData.link,
                latitude: gpsData.lat,
                longitude: gpsData.lon,
                locationTime: gpsData.time 
            };

            // MAGHIMO TA OG VARIABLE NGA MAGBANTAY KUNG LUWAS NA BA ANG DATA
            let isDataSaved = false;

            if (navigator.onLine) {
                let success = await sendDataToServer(data);
                if (success) {
                    bgMusic.pause(); bgMusic.currentTime = 0; // 🛑 IHUNONG ANG KANTA KAY SUCCESS NA!
                    alert("✅ Success! Check imong Google Sheet, nisulod na!");
                    isDataSaved = true; // Luwas na didto sa server!
                } else {
                    bgMusic.pause(); bgMusic.currentTime = 0; // 🛑 IHUNONG ANG KANTA
                    // KUNG MAPUTOL ANG INTERNET PAG-SEND! (Ang imong gipangutana)
                    alert("⚠️ Na-putol ang signal pag-send! I-save nato sa Offline Data sa imong selpon aron dili masayang.");
                    
                    // I-PUGOS OG SAVE SA LOCAL STORAGE BISAN PA OG "ONLINE" SIYA
                    let savedData = JSON.parse(localStorage.getItem('offlineData')) || [];
                    savedData.push(data);
                    localStorage.setItem('offlineData', JSON.stringify(savedData));
                    isDataSaved = true; // Luwas na kay na-save sa selpon!
                    //updateStatus(); // I-trigger ang offline indicator kung guba ang signal
                }
            } else {
                bgMusic.pause(); bgMusic.currentTime = 0; // 🛑 IHUNONG ANG KANTA
                // NORMAL OFFLINE SAVING
                let savedData = JSON.parse(localStorage.getItem('offlineData')) || [];
                savedData.push(data);
                localStorage.setItem('offlineData', JSON.stringify(savedData));
                alert("⚠️ Walay Internet! Gi-save ang imong Location ug Data sa device.");
                isDataSaved = true; // Luwas na kay na-save sa selpon!
            }

            // I-RESET LANG ANG FORM KUNG SIGURADO NGA "SAVED" ANG DATA
            if (isDataSaved) {
                myForm.reset();
                compressedPhotoBase64 = ""; 
                document.getElementById('photoPreview').style.display = "none"; 
            }
            
            // I-balik ang button sa normal pirme
            submitBtn.textContent = "I-Submit ang Data";
            submitBtn.disabled = false;
        });

        //updateStatus();
        showLiveLocationOnLoad(); 

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('./sw.js')
                .then(function(registration) {
                    console.log('Service Worker naka-register!');
                })
                .catch(function(error) {
                    console.log('Error sa Service Worker:', error);
                });
            });
        }





       // ==========================================
        // 🏍️ RIDER ID & NAME LOGIC (ALL-IN-ONE) 🏍️
        // ==========================================
        const idNumBox = document.getElementById('idNum');
        const nameBox = document.getElementById('name');

        // --- 1. DEVICE MEMORY (Default ID) ---
        const urlParams = new URLSearchParams(window.location.search);
        let paramID = urlParams.get('theIDno');
        let savedID = localStorage.getItem('defaultRiderID');

        if (paramID) {
            idNumBox.value = paramID;
            localStorage.setItem('defaultRiderID', paramID); // I-save dayon isip Default
        } else if (savedID) {
            idNumBox.value = savedID; // Gamiton ang naka-save kaniadto
        }

        // --- 2. AUTO-SEARCH SA MASTERLIST ---
        function searchDatabase(idToSearch) {
            if (idToSearch && typeof riderDatabase !== 'undefined') {
                const foundRider = riderDatabase.find(r => r.idNum === idToSearch);
                if (foundRider) {
                    nameBox.value = foundRider.fullname;
                } else {
                    nameBox.value = "❌ Wala sa Masterlist";
                }
            }
        }
        searchDatabase(idNumBox.value); // Daganon dayon inig abli sa app

        // --- 3. DOUBLE-TAP TO UNLOCK ---
        idNumBox.addEventListener('dblclick', function() {
            this.removeAttribute('readonly'); // I-unlock
            this.value = ""; // I-clear ang daan nga ID
            nameBox.value = ""; // I-clear ang pangalan
            this.focus(); // I-ready ang keyboard
            this.style.border = "3px solid #ffcc00"; // Mo-yellow ang border
        });

        // --- 4. BANTAYAN ANG PAG-TYPE (Auto-Lock inig 4 digits) ---
        idNumBox.addEventListener('input', function() {
            // Siguradohon nga NUMERO lang gyud ang pwede i-type
            this.value = this.value.replace(/[^0-9]/g, ''); 

            // Kung mo-abot na sa 4 ka digits...
            if (this.value.length === 4) {
                this.setAttribute('readonly', true); // I-lock og balik
                this.style.border = "1px solid #444"; // Balik sa normal ang border
                this.blur(); // I-tago ang keyboard
                
                searchDatabase(this.value); // Pangitaon dayon ang ngalan
                localStorage.setItem('defaultRiderID', this.value); // I-save isip bag-ong Default ID
            }
        });




        // --- 📷 QR CODE SCANNER LOGIC 📷 ---
        const scanBtn = document.getElementById('scanQrBtn');
        const scannerDiv = document.getElementById('reader');
        let html5QrCode; // Ang variable nga mogunit sa camera

        scanBtn.addEventListener('click', function() {
            // Kung naka-tago ang camera, ablihan nato
            if (scannerDiv.style.display === "none") {
                scannerDiv.style.display = "block";
                scanBtn.textContent = "🛑 I-CANCEL ANG PAG-SCAN";
                scanBtn.style.backgroundColor = "#cc0000"; // Pula nga button
                scanBtn.style.color = "white";

                html5QrCode = new Html5Qrcode("reader");
                
                // Paandaron ang LIKOD nga camera (environment)
                html5QrCode.start(
                    { facingMode: "environment" }, 
                    {
                        fps: 10, // Unsa ka paspas mo-basa (Frames per second)
                        qrbox: { width: 250, height: 250 } // Ang square nga box
                    },
                    (decodedText, decodedResult) => {
                        // 🎉 KUNG MAKA-SCAN OG QR CODE 🎉
                        
                        // 1. I-hunong ang camera ug i-tago ang box
                        html5QrCode.stop().then((ignore) => {
                            scannerDiv.style.display = "none";
                            scanBtn.textContent = "📷 I-SCAN ANG RIDER ID";
                            scanBtn.style.backgroundColor = "#ff9900"; // Balik sa orange
                            scanBtn.style.color = "black";
                            
                            // 2. I-butang ang na-scan nga ID didto sa Textbox!
                            const scannedID = decodedText;
                            document.getElementById('idNum').value = scannedID;
                            
                            // 3. Pangitaon dayon sa database.js kon kinsa siya!
                            if (typeof riderDatabase !== 'undefined') {
                                const foundRider = riderDatabase.find(r => r.idNum === scannedID);
                                if (foundRider) {
                                    document.getElementById('name').value = foundRider.fullname;
                                    // Pwede nato patingogon ang success music diri kung gusto nimo!
                                } else {
                                    document.getElementById('name').value = "❌ Wala sa Masterlist";
                                }
                            }
                        }).catch((err) => {
                            console.log("Error sa pag-stop sa camera.", err);
                        });
                    },
                    (errorMessage) => {
                        // Normal ra ni kung wala pay makita nga QR ang camera
                    }
                ).catch((err) => {
                    alert("⚠️ Wala ma-access ang Camera. Siguroha nga ni-allow ka sa pag-gamit niini.");
                });
            } else {
                // Kung i-cancel sa Marshal ang pag-scan (Click again)
                if (html5QrCode) {
                    html5QrCode.stop().then(() => {
                        scannerDiv.style.display = "none";
                        scanBtn.textContent = "📷 I-SCAN ANG RIDER ID";
                        scanBtn.style.backgroundColor = "#ff9900";
                        scanBtn.style.color = "black";
                    });
                }
            }
        });





        // ==========================================
        // 🚀 UPGRADE 2 & 3: DASHBOARD LOGIC 🚀
        // ==========================================

        
        // --- 📡 A. SIGNAL MONITOR (SMART INTERNET CHECKER) ---
        async function checkRealInternet() {
            const sigStatus = document.getElementById('signalStatus');

            // 1. Kung patay ang WiFi/Data (Airplane Mode), 100% OFFLINE dayon
            if (!navigator.onLine) {
                sigStatus.innerHTML = "🔴 OFFLINE";
                sigStatus.style.color = "#ff3333"; // Pula
                return;
            }

            // 2. Kung naka-connect sa WiFi/Data, TESTINGAN NATO KUNG NAAY INTERNET
            try {
                // Magpadala ta og gamayng 'ping' sa gawas (gigamit nato ang favicon sa Google)
                // Gibutangan nato og oras (new Date().getTime()) aron dili ta ilaron sa Service Worker
                await fetch('https://www.google.com/favicon.ico?' + new Date().getTime(), {
                    mode: 'no-cors',  // Pwersahon pag-gawas sa internet
                    cache: 'no-store' // Bawal mangopya sa daan nga gi-save
                });

                // Kung naka-lusot ang request, pasabot naay tinuod nga internet!
                sigStatus.innerHTML = "🟢 ONLINE";
                sigStatus.style.color = "#00ff00"; // Green

                // 🔥 SALBARON NATO ANG AUTO-SYNC DINHI 🔥
                // Kung naay pending data, i-send dayon kay naka-detect tag tinuod nga internet!
                let offlineData = JSON.parse(localStorage.getItem('offlineData')) || [];
                if (offlineData.length > 0) {
                    syncOfflineData(); 
                }

            } catch (error) {
                // Kung mapakyas (naay signal sa wifi pero walay internet / walay data load)
                sigStatus.innerHTML = "⚠️ NO INTERNET";
                sigStatus.style.color = "#ff9900"; // Orange nga Warning
            }
        }

        // I-dagan kini inig usab sa connection
        window.addEventListener('online', checkRealInternet);
        window.addEventListener('offline', checkRealInternet);
        
        // I-check kada 5 ka segundo aron sigurado gyud nga updated ang dashboard
        setInterval(checkRealInternet, 5000);
        checkRealInternet(); // I-dagan inig abli

        
        
        
        
        // --- 🔋 B. BATTERY MONITOR ---
        if ('getBattery' in navigator) {
            navigator.getBattery().then(function(battery) {
                function updateBatteryInfo() {
                    const level = Math.round(battery.level * 100);
                    const batStatus = document.getElementById('batteryStatus');
                    
                    // Kung nag-charge, butangan natog kilat ⚡
                    const icon = battery.charging ? "⚡" : "🔋";
                    batStatus.innerHTML = `${icon} ${level}%`;
                    
                    // Kung 15% paubos ug wala nag-charge, pa-pulahon nato!
                    if (level <= 15 && !battery.charging) {
                        batStatus.style.color = "#ff3333"; 
                        // Optional: Pwede ka mag-add og alert diri kung gusto nimo
                    } else {
                        batStatus.style.color = "white";
                    }
                }
                updateBatteryInfo();
                battery.addEventListener('levelchange', updateBatteryInfo);
                battery.addEventListener('chargingchange', updateBatteryInfo);
            });
        } else {
            document.getElementById('batteryStatus').innerHTML = "🔋 N/A";
        }

        // --- 📊 C. PENDING COUNTER ---
        function updateDashboardCounters() {
            let offlineData = JSON.parse(localStorage.getItem('offlineData')) || [];
            const pCount = document.getElementById('pendingCount');
            
            pCount.innerText = offlineData.length;
            
            // Kung naay pending, e-orange nato aron ma-notice. Kung wala, puti lang.
            if (offlineData.length > 0) {
                pCount.style.color = "#ff9900"; 
            } else {
                pCount.style.color = "white"; 
            }
        }
        // I-check ang pending count kada 2 ka segundo aron auto-update gyud pirmi
        setInterval(updateDashboardCounters, 2000);
        updateDashboardCounters(); // I-dagan inig abli





    </script>
</body>
</html>
