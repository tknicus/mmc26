<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MasterMinds Rider Report Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 15px; box-sizing: border-box; }
        .container { width: 100%; max-width: 600px; margin: auto; background: #1e1e1e; padding: 15px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); box-sizing: border-box; overflow: hidden; }
        
        h2 { text-align: center; color: #ffcc00; }
        
        /* GIAYO NGA SEARCH BOX PARA DILI MA-CUT */
        .search-box { display: flex; gap: 8px; margin-bottom: 20px; width: 100%; }
        input { flex: 1; min-width: 0; padding: 12px; font-size: 16px; border-radius: 5px; border: none; background: #333; color: white; text-align: center; box-sizing: border-box; }
        button { flex-shrink: 0; padding: 12px 15px; font-size: 15px; background-color: #ffcc00; color: black; border: none; font-weight: bold; cursor: pointer; border-radius: 5px; box-sizing: border-box; white-space: nowrap; }
        button:hover { background-color: #e6b800; }
        
        .card { background: #2a2a2a; padding: 15px; margin-bottom: 15px; border-radius: 8px; border-left: 5px solid #00ff00; word-wrap: break-word; box-sizing: border-box; }
        .card p { margin: 5px 0; font-size: 14px; }
        .card a { color: #00d2ff; text-decoration: none; word-break: break-all; }
        .card img { max-width: 100%; height: auto; border-radius: 5px; margin-top: 10px; display: block; }
        
        .no-data { text-align: center; color: #ff4d4d; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>📊 Rider Progress Tracker</h2>

        <!-- 🔙 BACK TO MENU BUTTON -->
        <div style="text-align: center; margin-bottom: 15px; margin-top: 10px;">
            <a href="menu.html" style="background-color: #222; color: #ffcc00; text-decoration: none; font-size: 12px; font-weight: bold; border: 1px solid #ffcc00; padding: 8px 15px; border-radius: 20px; display: inline-block; box-shadow: 0 2px 5px rgba(0,0,0,0.5);">
                ⬅️ Balik sa Main Menu
            </a>
        </div>

        <div class="search-box">
            <input type="text" id="searchId" placeholder="I-type ang Rider ID (e.g. 0001)">
            <button onclick="fetchRiderReport()">Pangitaa</button>
        </div>

        <div id="loading" style="text-align: center; display: none; color: #ffcc00;">Gisusi ang database base sa Rota sa Rider...</div>
        <div id="resultContainer"></div>
    </div>

    <!-- Gi-apil ang database.js aron mabasa ang rider levels -->
    <script src="database.js"></script>
    <script>
        // 🌐 MGA LAHI-LAHI NGA SCRIPT URL PARA SA MATAG ROTA 🌐
        // Butangi sa saktong Web App URL ang matag usa ka Rota base sa imong gihimo nga Google Sheets
        const routeScriptURLs = {
            "G5": "https://script.google.com/macros/s/AKfycbx3wEteB4HL7gy3t3dS-lon5kY4MwKn8XTh-7I-RpK7IT3EISSf-9WUr0XxKsUB1rc8/exec",
            "G3": "https://script.google.com/macros/s/AKfycbygg_k9reS3scefqvP_UKXxwCTihIBL0l2T5P1NgAaxMaXv_RBIP7sVfdNf3TXOnAmqyg/exec",
            "AS26": "https://script.google.com/macros/s/AKfycbxTau-qcMyRPmu753acuF4c6Pgm8jy3llrLSAzrzlS-0z-k_xmQoE_9-sl2yIXeMjJF/exec",
            "G1N": "https://script.google.com/macros/s/AKfycbzQFK6-oBnlLOKPk8_mvJST_ai__oAupaDSfjOKA3SK75CQ2vjl1_qadDsIDk8nbMIKCw/exec",
            "G1E": "https://script.google.com/macros/s/AKfycbzt_sabiNcZ5aJ0hu8CZYWLZ691Yz_skvk5QjjVloNxSK7NVSkEcRCBue_9tqZqPAtw5w/exec",
            "G1W": "https://script.google.com/macros/s/AKfycbxYIxvC_tZ1UOavjHrQdMMAsOyVjaX8Tn8AmczoAHkEUVLqnq_Nys5XJm22VGJ9ZbbdIQ/exec",
            "G1S": "https://script.google.com/macros/s/AKfycbzauIovOX8mY8D1MgPq2op-AmnFrkrREupLy6cILDPRqtUx1UqaE7P3hCYKNvITgGhX/exec",
            "G4": "https://script.google.com/macros/s/AKfycby8eFI-lHgB71fiDWBVy_Jm9U2SPlvHw2hfDr_2NQr5YZkzpbAQmO8DspSvT6XAtxbz/exec",
            "DEFAULT": "https://script.google.com/macros/s/AKfycbxTau-qcMyRPmu753acuF4c6Pgm8jy3llrLSAzrzlS-0z-k_xmQoE_9-sl2yIXeMjJF/exec"
        };
        
        // 👉 KINI ANG PINS TIME FORMATTER FUNCTION
        function formatPinasTime(dateString) {
            if (!dateString) return "Wala'y Oras";
            try {
                let d = new Date(dateString);
                if (isNaN(d.getTime())) return dateString; 
                
                return d.toLocaleString('en-PH', { 
                    timeZone: 'Asia/Manila',
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: true
                });
            } catch (e) {
                return dateString; 
            }
        }

        async function fetchRiderReport() {
            const id = document.getElementById('searchId').value.trim();
            const container = document.getElementById('resultContainer');
            const loading = document.getElementById('loading');

            if (!id) {
                alert("Palihug pag-type og Rider ID, Prof!");
                return;
            }

            container.innerHTML = "";
            loading.style.display = "block";

            try {
                // 1. PANGITAON SA DATABASE.JS ANG LEVEL/ROTA SA RIDER
                let riderLevel = "DEFAULT";
                let riderName = "Unknown";

                if (typeof riderDatabase !== 'undefined' && Array.isArray(riderDatabase)) {
                    let foundRider = riderDatabase.find(r => r.idNum === id);
                    if (foundRider) {
                        riderLevel = foundRider.level ? foundRider.level.trim() : "DEFAULT";
                        riderName = foundRider.fullname || "Unknown";
                    }
                }

                // 2. PILION ANG SAKTONG WEB APP URL BASE SA LEVEL SA RIDER
                let activeScriptURL = routeScriptURLs[riderLevel] || routeScriptURLs["DEFAULT"];

                if (!activeScriptURL || activeScriptURL.includes("BUTANGI_DINHI")) {
                    loading.style.display = "none";
                    container.innerHTML = `<div class="no-data">⚠️ Wala pa na-set ang Google Sheet URL para sa level: ${riderLevel}</div>`;
                    return;
                }

                // 3. KUHAON ANG DATA GIKAN SA SAKTONG GOOGLE SHEET
                let response = await fetch(`${activeScriptURL}?action=getReport&id=${id}`);
                let records = await response.json();

                loading.style.display = "none";

                if (!Array.isArray(records) || records.length === 0) {
                    container.innerHTML = `<div class="no-data">Wala pay nakit-an nga rekord para sa Rider ID: ${id} (Rota: ${riderLevel})</div>`;
                    return;
                }

                // ==========================================
                // 🌟 SMART SORTING MAGIC (CP 00 TO CP FL)
                // ==========================================
                records.sort((a, b) => {
                    let cpA = String(a.checkpoint).toUpperCase();
                    let cpB = String(b.checkpoint).toUpperCase();

                    if (cpA.includes("FL")) return 1;
                    if (cpB.includes("FL")) return -1;

                    if (cpA < cpB) return -1;
                    if (cpA > cpB) return 1;
                    return 0;
                });
                // ==========================================
                
                let html = `<h3>Rider: ${riderName} (${id})</h3>`;
                html += `<p style="text-align:center; color:#00ff00; font-size:12px; margin-top:-5px;">Rota: ${riderLevel} | Naagian: ${records.length} Checkpoints</p>`;
                
                records.forEach((rec, index) => {
                    let formattedTime = formatPinasTime(rec.appTime);

                    html += `
                        <div class="card">
                            <p><strong>#${index + 1} Checkpoint:</strong> <span style="color: #ffcc00;">${rec.checkpoint}</span></p>
                            <p><strong>Odometer:</strong> ${rec.odometer}</p>
                            <p><strong>Notes/Remarks:</strong> ${rec.notes || "Wala'y notes"}</p>
                            <p><strong>Oras sa Pagpasa:</strong> ${formattedTime}</p>
                            <p><strong>Map Link:</strong> <a href="${rec.mapLink}" target="_blank">Tan-awa sa Google Maps 🗺️</a></p>
                            ${rec.photoUrl && rec.photoUrl !== "Walay Ebidensya" ? `<p><strong>Ebidensya:</strong><br><img src="${rec.photoUrl}" alt="Checkpoint Photo"></p>` : ''}
                        </div>
                    `;
                });

                container.innerHTML = html;

            } catch (error) {
                loading.style.display = "none";
                container.innerHTML = `<div class="no-data">Error sa pagkuha sa data. Susiha ang imong Web App URL o koneksyon.</div>`;
                console.error(error);
            }
        }
    </script>
</body>
</html>
