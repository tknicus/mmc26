        }

            color: white;
            border: 1px solid #0088ff;
            padding: 8px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        .action-btn {
            background-color: #0088ff;
            color: white;
            border: none;
            padding: 8px 12px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            font-size: 11px;
        }

        .action-btn:hover {
            background-color: #0066cc;
        }

        .back-btn {
            background-color: #cc0000;
        }

        .back-btn:hover {
            background-color: #990000;

        // Function sa pag-ilis sa ruta inig pili sa dropdown (Mosumbalik sa OSRM ug mosulod sa saktong Database)
        async function switchRoute() {
            let selectedKey = document.getElementById('routeSelect').value;
            let badge = document.getElementById('distanceBadge');
            
            routePolylineLayer.clearLayers();

            if (!routesData[selectedKey] || routesData[selectedKey].length < 2) {
                badge.style.display = "none";
                loadRidersToMap("none"); 
                return;
            }

            let coords = routesData[selectedKey];
            let coordString = coords.map(c => `${c[1]},${c[0]}`).join(';');
            let osrmUrl = `https://router.project-osrm.org/route/v1/driving/${coordString}?overview=full&geometries=geojson`;

            try {
                let response = await fetch(osrmUrl);
                let data = await response.json();

                if (data.routes && data.routes.length > 0) {
                    let routeData = data.routes[0];
                    let routeCoords = routeData.geometry.coordinates.map(c => [c[1], c[0]]); 

                    let totalKm = (routeData.distance / 1000).toFixed(1);
                    badge.innerText = `🏁 Total: ${totalKm} KM`;
                    badge.style.display = "block";

                    let roadPolyline = L.polyline(routeCoords, {
                        color: '#ff0000', 
                        weight: 4,
                        opacity: 0.85
                    });

                    routePolylineLayer.addLayer(roadPolyline);
                    map.fitBounds(roadPolyline.getBounds());
                }
            } catch (error) {
                console.error("Napakyas pagkuha sa OSRM route:", error);
                badge.style.display = "none";
            }

            // 🚀 KUHAON ANG MGA RIDERS GIKAN SA SAKTONG GOOGLE SHEET URL SA NAPILI NGA ROTA
            loadRidersToMap(selectedKey);
        }

        // 4. KUHAON ANG LIVE RIDERS GIKAN SA SAKTONG DATABASE URL BASE SA ROTA
        async function loadRidersToMap(selectedRoute = "none") {
            markerLayer.clearLayers();

            if (selectedRoute === "none" || !routeScriptURLs[selectedRoute]) {
                return; // Kung walay pinili o "none", walay i-load nga markers
            }

            let activeURL = routeScriptURLs[selectedRoute] + "?action=getAllLocations";

            try {
                let response = await fetch(activeURL);
                let data = await response.json(); 

                if (!Array.isArray(data)) return;

                data.forEach(rider => {
                    let lat = parseFloat(rider.latitude);
                    let lon = parseFloat(rider.longitude);

                    if (!isNaN(lat) && !isNaN(lon)) {
                        let formattedTime = "Wala";
                        if (rider.timestamp) {
                            let d = new Date(rider.timestamp);
                            formattedTime = d.toLocaleString('en-PH', {
                                timeZone: 'Asia/Manila',
                                year: 'numeric',
                                month: 'short',
                                day: 'numeric',
                                hour: '2-digit',
                                minute: '2-digit',
                                second: '2-digit',
                                hour12: false
                            });
                        }
                        
                        let marker = L.marker([lat, lon]);
                        marker.bindPopup(`
                            <div style="color: black; font-family: Arial; font-size: 13px;">
                                <b>🏍️ ID: ${rider.idNum}</b><br>
                                👤 Pangalan: <b>${rider.name}</b><br>
                                📍 Checkpoint: <b>${rider.checkpoint}</b><br>
                                🛣️ Rota/Level: <b>${rider.level || selectedRoute}</b><br>
                                ⚙️ Odometer: ${rider.odometer} KM<br>
                                🕒 Oras: ${formattedTime}<br>
                                📝 Notes: <b>${rider.notes || 'Wala'}</b><br>
                                <a href="${rider.location}" target="_blank">🗺️ Google Maps</a>
                            </div>
                        `);
                        markerLayer.addLayer(marker);
                    }
                });
            } catch (error) {
                console.error("Wala nakuha ang live riders para sa rotangni " + selectedRoute, error);
            }
        }
    </script>
