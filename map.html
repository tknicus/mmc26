<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MasterMinds'CUP Live Map & Routes</title>
    
    <!-- 🗺️ LEAFLET CSS (Map Design) 🗺️ -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #f5f5f5;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: #1e1e1e;
            padding: 10px 15px;
            text-align: center;
            border-bottom: 4px solid #0088ff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        h2 {
            margin: 0;
            color: #ffffff;
            text-transform: uppercase;
            font-style: italic;
            letter-spacing: 1px;
            font-size: 15px;
        }

        .header-controls {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        #map {
            flex-grow: 1;
            width: 100%;
            background-color: #222;
        }

        select {
            background-color: #2a2a2a;
            color: white;
            border: 1px solid #0088ff;
            padding: 8px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        .action-btn {
            background-color: #0088ff;
            color: white;
            border: none;
            padding: 8px 12px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            font-size: 11px;
        }

        .action-btn:hover {
            background-color: #0066cc;
        }

        .back-btn {
            background-color: #cc0000;
        }

        .back-btn:hover {
            background-color: #990000;
        }
    </style>
</head>
<body>

    <header>
        <h2>🗺️ Command Center & Routes</h2>
        <div class="header-controls">
            <!-- 🔽 ROUTE SELECTOR DROPDOWN -->
            <select id="routeSelect" onchange="switchRoute()">
                <option value="none">🗺️ Pilia ang Rota (Tanang Rota Hidden)</option>
                <option value="G1N">Ruta: G1N (North)</option>
                <option value="G1E">Ruta: G1E (East)</option>
                <option value="G1W">Ruta: G1W (West)</option>
                <option value="G1S">Ruta: G1S (South)</option>
                <option value="G3">Ruta: G3 (Mindanao 3333km)</option>
                <option value="G4">Ruta: G4 (Talaingod)</option>
                <option value="G5">Ruta: G5 (Man of Steel)</option>
                <option value="AS26">Ruta: AS26 (Extreme)</option>
            </select>

            <!-- 📏 KUNG ASA MOGAWAS ANG TOTAL KILOMETERS -->
            <div id="distanceBadge" class="distance-badge" style="display: none;">Total: 0 KM</div>

            <button class="action-btn" onclick="switchRoute()">🔄 Refresh Live Riders</button>
            <button class="action-btn back-btn" onclick="window.location.href='menu.html'">🔙 Menu</button>
        </div>
    </header>

    <div id="map"></div>

    <!-- 🗺️ LEAFLET JS SCRIPT 🗺️ -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. I-center ang mapa sa Mindanao
        const map = L.map('map').setView([7.4392, 125.7956], 8);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let markerLayer = L.layerGroup().addTo(map);
        let routePolylineLayer = L.layerGroup().addTo(map);

        // 🌐 MGA LAHI-LAHI NGA SCRIPT URL PARA SA MATAG ROTA (Multi-Database Routing)
        // Ibutang dinhi ang mga tinuod nga Web App URLs sa tagsa-tagsa nimo ka Google Sheets
        const routeScriptURLs = {
            "AS26": "https://script.google.com/macros/s/AKfycbxTau-qcMyRPmu753acuF4c6Pgm8jy3llrLSAzrzlS-0z-k_xmQoE_9-sl2yIXeMjJF/exec",
            "G5": "https://script.google.com/macros/s/AKfycbx3wEteB4HL7gy3t3dS-lon5kY4MwKn8XTh-7I-RpK7IT3EISSf-9WUr0XxKsUB1rc8/exec",
            "G4": "https://script.google.com/macros/s/AKfycby8eFI-lHgB71fiDWBVy_Jm9U2SPlvHw2hfDr_2NQr5YZkzpbAQmO8DspSvT6XAtxbz/exec",
            "G3": "https://script.google.com/macros/s/AKfycbygg_k9reS3scefqvP_UKXxwCTihIBL0l2T5P1NgAaxMaXv_RBIP7sVfdNf3TXOnAmqyg/exec",
            "G1N": "https://script.google.com/macros/s/AKfycbzQFK6-oBnlLOKPk8_mvJST_ai__oAupaDSfjOKA3SK75CQ2vjl1_qadDsIDk8nbMIKCw/exec",
            "G1E": "https://script.google.com/macros/s/AKfycbzt_sabiNcZ5aJ0hu8CZYWLZ691Yz_skvk5QjjVloNxSK7NVSkEcRCBue_9tqZqPAtw5w/exec",
            "G1W": "https://script.google.com/macros/s/AKfycbxYIxvC_tZ1UOavjHrQdMMAsOyVjaX8Tn8AmczoAHkEUVLqnq_Nys5XJm22VGJ9ZbbdIQ/exec",
            "G1S": "https://script.google.com/macros/s/AKfycbzauIovOX8mY8D1MgPq2op-AmnFrkrREupLy6cILDPRqtUx1UqaE7P3hCYKNvITgGhX/exec"
        };

        // 2. IMONG MGA ROTA COORDINATES (Kung asa nimo gibutang ang routesData)
        const routesData = {
            "G1N": [], // Ibutang ang array sa coords diri kung naa na
            "G1E": [],
            "G1W": [],
            "G1S": [],
            "G3": [],
            "G4": [],
            "G5": [],
            "AS26": []
        };

        // Function sa pag-ilis sa ruta inig pili sa dropdown (Mosumbalik sa OSRM ug mosulod sa saktong Database)
        async function switchRoute() {
            let selectedKey = document.getElementById('routeSelect').value;
            let badge = document.getElementById('distanceBadge');
            
            routePolylineLayer.clearLayers();

            if (!routesData[selectedKey] || routesData[selectedKey].length < 2) {
                badge.style.display = "none";
                loadRidersToMap("none"); 
                return;
            }

            let coords = routesData[selectedKey];
            let coordString = coords.map(c => `${c[1]},${c[0]}`).join(';');
            let osrmUrl = `https://router.project-osrm.org/route/v1/driving/${coordString}?overview=full&geometries=geojson`;

            try {
                let response = await fetch(osrmUrl);
                let data = await response.json();

                if (data.routes && data.routes.length > 0) {
                    let routeData = data.routes[0];
                    let routeCoords = routeData.geometry.coordinates.map(c => [c[1], c[0]]); 

                    let totalKm = (routeData.distance / 1000).toFixed(1);
                    badge.innerText = `🏁 Total: ${totalKm} KM`;
                    badge.style.display = "block";

                    let roadPolyline = L.polyline(routeCoords, {
                        color: '#ff0000', 
                        weight: 4,
                        opacity: 0.85
                    });

                    routePolylineLayer.addLayer(roadPolyline);
                    map.fitBounds(roadPolyline.getBounds());
                }
            } catch (error) {
                console.error("Napakyas pagkuha sa OSRM route:", error);
                badge.style.display = "none";
            }

            // 🚀 KUHAON ANG MGA RIDERS GIKAN SA SAKTONG GOOGLE SHEET URL SA NAPILI NGA ROTA
            loadRidersToMap(selectedKey);
        }

        // 4. KUHAON ANG LIVE RIDERS GIKAN SA SAKTONG DATABASE URL BASE SA ROTA
        async function loadRidersToMap(selectedRoute = "none") {
            markerLayer.clearLayers();

            if (selectedRoute === "none" || !routeScriptURLs[selectedRoute]) {
                return; // Kung walay pinili o "none", walay i-load nga markers
            }

            let activeURL = routeScriptURLs[selectedRoute] + "?action=getAllLocations";

            try {
                let response = await fetch(activeURL);
                let data = await response.json(); 

                if (!Array.isArray(data)) return;

                data.forEach(rider => {
                    let lat = parseFloat(rider.latitude);
                    let lon = parseFloat(rider.longitude);

                    if (!isNaN(lat) && !isNaN(lon)) {
                        let formattedTime = "Wala";
                        if (rider.timestamp) {
                            let d = new Date(rider.timestamp);
                            formattedTime = d.toLocaleString('en-PH', {
                                timeZone: 'Asia/Manila',
                                year: 'numeric',
                                month: 'short',
                                day: 'numeric',
                                hour: '2-digit',
                                minute: '2-digit',
                                second: '2-digit',
                                hour12: false
                            });
                        }
                        
                        let marker = L.marker([lat, lon]);
                        marker.bindPopup(`
                            <div style="color: black; font-family: Arial; font-size: 13px;">
                                <b>🏍️ ID: ${rider.idNum}</b><br>
                                👤 Pangalan: <b>${rider.name}</b><br>
                                📍 Checkpoint: <b>${rider.checkpoint}</b><br>
                                🛣️ Rota/Level: <b>${rider.level || selectedRoute}</b><br>
                                ⚙️ Odometer: ${rider.odometer} KM<br>
                                🕒 Oras: ${formattedTime}<br>
                                📝 Notes: <b>${rider.notes || 'Wala'}</b><br>
                                <a href="${rider.location}" target="_blank">🗺️ Google Maps</a>
                            </div>
                        `);
                        markerLayer.addLayer(marker);
                    }
                });
            } catch (error) {
                console.error("Wala nakuha ang live riders para sa rotangni " + selectedRoute, error);
            }
        }
    </script>

</body>
</html>
