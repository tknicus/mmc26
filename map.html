<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MasterMinds'CUP Live Map Tracker</title>
    
    <!-- 🗺️ LEAFLET CSS (Map Design) 🗺️ -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #f5f5f5;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: #1e1e1e;
            padding: 15px;
            text-align: center;
            border-bottom: 4px solid #0088ff;
        }

        h2 {
            margin: 0;
            color: #ffffff;
            text-transform: uppercase;
            font-style: italic;
            letter-spacing: 1px;
            font-size: 18px;
        }

        #map {
            flex-grow: 1;
            width: 100%;
            background-color: #222;
        }

        .back-btn {
            background-color: #cc0000;
            color: white;
            border: none;
            padding: 12px 20px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            margin: 10px auto;
            display: block;
            border-radius: 4px;
            width: 90%;
            max-width: 300px;
        }

        .back-btn:hover {
            background-color: #990000;
        }
    </style>
</head>
<body>

    <header>
        <h2>🗺️ MasterMinds Live Map Command Center</h2>
    </header>

    <!-- Dinhi mogawas ang Interactive Map -->
    <div id="map"></div>

    <button class="back-btn" onclick="window.location.href='menu.html'">🔙 Balik sa Menu Portal</button>

    <!-- 🗺️ LEAFLET JS SCRIPT 🗺️ -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. I-center ang mapa sa Davao / Bukidnon area (Default view)
        const map = L.map('map').setView([7.4392, 125.7956], 10);

        // 2. I-load ang Dark Theme Map tiles (CartoDB Dark)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // 3. KUHAON ANG DATA GIKAN SA GOOGLE SHEET API
        const scriptURL = 'https://script.google.com/macros/s/AKfycby_4MwwGkRxmWI2zND7fiQN3N9wTmkm3TCg6f5xteV0bEwAj89xOCte6gRYqUE6AsB6/exec?action=getAllLocations';
        async function loadRidersToMap() {
            try {
                let response = await fetch(scriptURL);
                let data = await response.json(); 

                // I-loop ang matag record gikan sa Google Sheet
                data.forEach(rider => {
                    let lat = parseFloat(rider.latitude);
                    let lon = parseFloat(rider.longitude);

                    // Kon husto ang lat ug lon, butangan og marker sa mapa
                    if (!isNaN(lat) && !isNaN(lon)) {
                        let marker = L.marker([lat, lon]).addTo(map);
                        marker.bindPopup(`
                            <div style="color: black; font-family: Arial; font-size: 13px;">
                                <b>🏍️ ID: ${rider.idNum}</b><br>
                                👤 Pangalan: <b>${rider.name}</b><br>
                                📍 Checkpoint: <b>${rider.checkpoint}</b><br>
                                ⚙️ Odometer: ${rider.odometer} KM<br>
                                📝 Notes: ${rider.notes || 'Wala'}<br>
                                🕒 Oras: ${rider.timestamp}<br>
                                <a href="${rider.location}" target="_blank">🗺️ Tan-awa sa Google Maps</a>
                            </div>
                        `);
                    }
                });
            } catch (error) {
                console.error("Wala nakuha ang data sa mapa:", error);
            }
        }

        // Tawgon ang function inig abli sa pahina
        loadRidersToMap();
    </script>

</body>
</html>
